        type: predict
        difficulty: medium
        xp: 20
        prompt: "O que a tela vai mostrar? (a ordem importa!)"
        code: |
          class player:
              def move_forward(self, passos):
                  print("andou", passos, "passos")

              def turn_left(self):
                  print("virou à esquerda")

          player = player()
          player.turn_left()
          player.move_forward(1)
        answer: |
          virou à esquerda
          andou 1 passos
        hints:
          - "Os comandos rodam de cima para baixo: primeiro vira, depois anda."
