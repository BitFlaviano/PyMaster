# ────────────────────────────────────────────────────────────────
  - id: kids_jogo
    title: "O herói e os comandos do jogo"
    color: "#eab308"
    goals: ["kids"]
    summary: "Comandos mágicos do tipo player.move_forward(): mover, virar, empurrar, falar e construir."
    lessons:
      - id: kids_jogo_intro
        title: "Comandos do herói"
        blocks:
          - type: text
            body: |
              O personagem do jogo se chama `player`. Para dar um comando, escrevemos `player`, um ponto, o nome do comando e os parênteses — como em `player.move_forward(3)`.

              ```python
              class player:
                  def move_forward(self, passos):
                      print("andou", passos, "passos")

              player = player()
              player.move_forward(3)   # andou 3 passos
              ```

              O número dentro dos parênteses é um **argumento**: ele muda o comportamento do comando.
          - type: text
            body: |
              Os comandos rodam **um depois do outro, de cima para baixo** — a ordem importa:

              ```python
              class player:
                  def turn_left(self):
                      print("virou à esquerda")

                  def move_forward(self, passos):
                      print("andou", passos, "passos")

              player = player()
              player.turn_left()
              player.move_forward(2)
              ```

              Comandos do herói: `move_forward(passos)`, `turn_left()`, `turn_right()`, `push()`, `speak(texto)` e `build(peca)`.
          - type: callout
            body: "player.move_forward() é uma função do objeto player: primeiro o objeto, depois um ponto, depois o comando."
    exercises:
      - id: kids_jogo_1
        type: predict
        difficulty: easy
        xp: 15
        prompt: "O que a tela vai mostrar?"
        code: |
          class player:
              def move_forward(self, passos):
                  print("andou", passos, "passos")

          player = player()
          player.move_forward(2)
        answer: |
          andou 2 passos
        hints:
          - "O número 2 vai para o lugar de passos."
        time_estimate: 90

