      - id: projeto_final_boss
        type: write
        difficulty: hard
        xp: 90
        prompt: |
          Chefão final (escreva o código): um **caixa registradora** inteirinho.

          A classe `Caixa` deve ter:
          1. `__init__` criando `self.itens = {}` (nome do item → valor acumulado);
          2. `registrar(nome, preco, qtde=1)` somando `preco * qtde` usando `.get()`;
          3. `total()` devolvendo `sum(self.itens.values())`;
          4. `pagar(valor)` devolvendo `round(valor - self.total(), 2)`.

          Depois, registre 2 cafés a R$ 5,50 cada e 1 pão a R$ 4,00, exiba o total
          arredondado com 2 casas e o troco para um pagamento de R$ 20,00.
        tests:
          - name: Café, pão e troco
            expected: |
              15.0
              5.0
        must_include:
          - "class Caixa"
        hints:
          - "self.itens[nome] = self.itens.get(nome, 0) + preco * qtde guarda o acumulado."
          - "Café: 5.5 * 2 = 11.0; pão: 4.0 → total 15.0; troco de 20 = 5.0."
        solution: |
          class Caixa:
              def __init__(self):
                  self.itens = {}

              def registrar(self, nome, preco, qtde=1):
                  self.itens[nome] = self.itens.get(nome, 0) + preco * qtde

              def total(self):
                  return sum(self.itens.values())

              def pagar(self, valor):
                  return round(valor - self.total(), 2)

          c = Caixa()
          c.registrar("cafe", 5.5, 2)
          c.registrar("pao", 4.0)
          print(round(c.total(), 2))
          print(c.pagar(20.0))
        time_estimate: 480