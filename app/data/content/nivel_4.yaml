      - id: closures_4
        type: write
        difficulty: hard
        xp: 40
        prompt: |
          Escreva uma função `contador()` que use uma variável interna e `nonlocal` para contar quantas vezes foi chamada. Exiba o resultado de três chamadas.
        tests:
