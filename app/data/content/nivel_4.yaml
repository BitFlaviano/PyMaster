  - id: closures
    title: "Closures"
    color: "#a3e635"
    summary: "Funções que 'lembram' das variáveis do ambiente em que nasceram."
    lessons:
      - id: closures_intro
        title: "Funções que guardam memória"
        blocks:
          - type: text
            body: |
              Uma função pode **devolver outra função**. Quando a interna usa variáveis da externa, ela as **captura** — isso é uma **closure**:

              ```python
              def criar_multiplicador(n):
                  def multiplicar(x):
                      return x * n          # n capturado!
                  return multiplicar

              dobro = criar_multiplicador(2)
              print(dobro(5))               # 10
              ```

              `dobro` "lembra" que n é 2 por quanto tempo sobreviver.
          - type: text
            body: |
              Cada chamada cria uma closure independente:

              ```python
              triplo = criar_multiplicador(3)
              print(triplo(4))               # 12
              print(dobro(4))                # 8
              ```
          - type: callout
            body: "Closures são a base de decoradores e de contadores de fábricas. Repare: `return multiplicar` devolve a função, sem chamar."
    exercises:
      - id: closures_1
        type: predict
        difficulty: easy
        xp: 20
        prompt: "O que será exibido?"
        code: |
