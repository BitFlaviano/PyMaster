  - id: funcoes_parciais
    title: "Funções parciais"
    color: "#f59e0b"
    summary: "functools.partial congela argumentos e cria variações de uma função prontas para reusar."
    lessons:
      - id: funcoes_parciais_intro
        title: "Congelando argumentos"
        blocks:
          - type: text
            body: |
              `functools.partial` devolve uma nova função com alguns argumentos já preenchidos:

              ```python
              from functools import partial

              def potencia(base, expoente):
                  return base ** expoente

              quadrado = partial(potencia, expoente=2)
              print(quadrado(5))   # 25
              ```

              Vantagem: você adapta uma função pronta a interfaces que esperam menos argumentos — como `map` e `filter`.
          - type: callout
            body: "partial não executa a função: só guarda os argumentos fixados."
