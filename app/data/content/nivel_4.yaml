  - id: funcoes_ordem_superior
    title: "Map, filter e reduce"
    color: "#fb923c"
    summary: "Aplicar transformação, filtragem e acumulação sobre sequências em uma linha."
    lessons:
      - id: funcoes_ordem_superior_intro
        title: "Transformar, filtrar e acumular"
        blocks:
          - type: text
            body: |
              **`map`** aplica uma função a cada item:

              ```python
              print(list(map(str, [1, 2, 3])))   # ['1', '2', '3']
              ```

              **`filter`** mantém só o que passar no teste:

              ```python
              print(list(filter(lambda x: x % 2 == 0, range(6))))  # [0, 2, 4]
              ```

              **`reduce`** acumula os itens usando a função do zero ao fim:
              ```python
              from functools import reduce
              print(reduce(lambda a, b: a + b, [1, 2, 3, 4]))       # 10
              ```
          - type: callout
            body: "map e filter devolvem iteradores; envolva com list() para ver o resultado. reduce vive no módulo functools."
    exercises:
      - id: funcoes_ordem_superior_1
        type: predict
        difficulty: easy
        xp: 20
        prompt: "O que será exibido?"
        code: |
