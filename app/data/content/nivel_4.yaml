        blocks:
          - type: text
            body: |
              Uma **expressão regular** descreve um padrão de texto. O módulo `re` aplica o padrão em qualquer string.

              ```python
              import re

              print(re.findall(r"\d+", "tel 123 e 99"))   # ['123', '99']
              ```

              `\d` casa um dígito; `\d+` um ou mais dígitos seguidos. O `r` antes da string deixa `\d` literal.
          - type: text
            body: |
              `re.search` flagra o padrão e `re.sub` **substitui** trechos:

              ```python
              import re

              print(bool(re.search(r"\d", "abc123")))    # True
              print(re.sub(r"\d", "#", "A1B2"))          # A#B#
              ```
          - type: callout
            body: "Padrões comuns: \\d dígito, \\s espaço, \\w letra/número, [a-z] faixa, + e * quantificadores."
