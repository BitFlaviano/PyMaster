    title: "Decoradores"
    color: "#c084fc"
    summary: "Funções que embrulham outras funções para adicionar comportamento."
    lessons:
      - id: decorators_intro
        title: "Embrulhar funções"
        blocks:
          - type: text
            body: |
              Um **decorador** recebe uma função e devolve outra, enriquecida. A sintaxe `@nome` aplica o embrulho:

              ```python
              def saudacao(funcao):
                  def interna():
                      print("antes")
                      funcao()
                      print("depois")
                  return interna

              @saudacao
              def ola():
                  print("olá")

              ola()   # antes / olá / depois
              ```

              `@saudacao` equivale a `ola = saudacao(ola)`.
          - type: callout
            body: "Decoradores são usados em frameworks (Flask/FastAPI) e para logs, permissões, cache e timing — sem sujar a função original."
