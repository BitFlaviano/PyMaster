  # ────────────────────────────────────────────────────────────────
  - id: oop_intro
    title: "Introdução a classes e objetos"
    color: "#f97316"
    summary: "Classes desenham o molde; objetos são as peças criadas a partir dele."
    lessons:
      - id: oop_intro
        title: "Molde e peça"
        blocks:
          - type: text
            body: |
              Uma **classe** é um molde. Um **objeto** é uma peça criada a partir do molde.

              ```python
              class Conta:
                  def __init__(self, saldo=0):
                      self.saldo = saldo

                  def depositar(self, valor):
                      self.saldo += valor

              c = Conta(100)      # cria o objeto
              c.depositar(50)
              print(c.saldo)      # 150
              ```

              - `__init__` roda na criação do objeto.
              - `self` é uma palavra especial que aponta para o próprio objeto.
              - Os métodos são funções dentro da classe.
          - type: code
            code: |
              class Cachorro:
                  def __init__(self, nome):
                      self.nome = nome

                  def latir(self):
                      print(f"{self.nome}: au au!")

              rex = Cachorro("Rex")
              rex.latir()
          - type: callout
            body: "self não é decorativo: ele é o 'cada objeto carrega os próprios dados'. Nos métodos, sempre vem primeiro."
    exercises:
      - id: oop_intro_1
        type: complete
        difficulty: medium
        xp: 25
        prompt: |
          Complete com o nome do método que roda **na criação** do objeto:
        code: |
          class Conta:
              def ____(self, saldo=0):
                  self.saldo = saldo
        answer: '__init__'
        hints:
          - "É o método de inicialização."
          - "Começa e termina com dois underscores."
        solution: |
          class Conta:
              def __init__(self, saldo=0):
                  self.saldo = saldo
        time_estimate: 120

