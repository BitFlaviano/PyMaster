        xp: 40
        time_estimate: 240
        prompt: 'Exercicio do learnpython.org (Basic String Operations): troque a string s
          para "Strings are awesome!" e rode o codigo que imprime len, indice de "a", contagem
          de "a", fatias, maiusculas, minusculas, startswith/endswith e split.'
        solution: "s = \"Strings are awesome!\"\nprint(\"Length of s = %d\" % len(s))\nprint(\"\
          The first occurrence of the letter a = %d\" % s.index(\"a\"))\nprint(\"a occurs\
          \ %d times\" % s.count(\"a\"))\nprint(\"The first five characters are '%s'\" % s[:5])\n\
          print(\"The next five characters are '%s'\" % s[5:10])\nprint(\"The thirteenth character\
          \ is '%s'\" % s[12])\nprint(\"The characters with odd index are '%s'\" % s[1::2])\n\
          print(\"The last five characters are '%s'\" % s[-5:])\nprint(\"String in uppercase:\
