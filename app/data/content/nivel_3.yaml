  - id: introspeccao
    title: "Conheça o código (Introspecção)"
    color: "#94a3b8"
    summary: "type(), dir(), getattr() e hasattr(): perguntar ao próprio Python o que ele sabe sobre os objetos."
    lessons:
      - id: introspeccao_intro
        title: "Interrogar os objetos"
        blocks:
          - type: text
            body: |
              **Introspecção** é o código olhando para si mesmo. O Python entrega esse superpoder de graça:

              ```python
              print(type([]))     # <class 'list'>
              print(type(3.14))   # <class 'float'>
              ```

              `hasattr` pergunta se existe um atributo, e `getattr` busca/explica o atributo:
              ```python
              print(hasattr("abc", "upper"))    # True
              print(getattr("oi", "upper")())   # OI
              ```
          - type: callout
            body: "dir(objeto) lista tudo que ele sabe fazer. É a primeira ferramenta de quem 'trava' e quer descobrir o próximo passo."
    exercises:
      - id: introspeccao_1
        type: predict
        difficulty: easy
        xp: 15
        prompt: "O que será exibido?"
        code: |
          print(type([]))
          print(type(3.14))
        answer: |
          <class 'list'>
          <class 'float'>
        hints:
          - "type() devolve a classe do valor."
        time_estimate: 60

      - id: introspeccao_2
        type: predict
        difficulty: medium
        xp: 20
        prompt: "O que será exibido?"
        code: |
          print(hasattr("abc", "upper"))
          print(hasattr("abc", "zzz"))
        answer: |
          True
          False
        hints:
          - "strings têm o método upper; não têm zzz."
        time_estimate: 60

      - id: introspeccao_3
        type: predict
        difficulty: medium
        xp: 20
        prompt: "O que será exibido?"
        code: |
          print(getattr("oi", "upper")())
        answer: |
          OI
        hints:
          - "getattr busca o método e () o chama."
        time_estimate: 60

