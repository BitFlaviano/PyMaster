          print(statistics.mean([10, 20, 30]))
        allow_imports: ["statistics", "os", "sys"]
        time_estimate: 120

      - id: modulos_5
        type: choice
        difficulty: medium
        xp: 25
        prompt: |
          Qual importação traz apenas a função `sqrt`, sem precisar escrever `math.` antes?
        options:
          - "import math"
          - "from math import sqrt"
          - "import sqrt"
        answer: "1"
        hints:
          - "O formato é from módulo import função."
        time_estimate: 60



      - id: modulos_boss
        type: write
        difficulty: hard
        xp: 60
        time_estimate: 420
        prompt: 'Chefão (escreva o código): usando os módulos `math` e `statistics`, calcule a média das notas `[7, 6, 8]` com `statistics.mean()`. Exiba o piso da média (`math.floor()`) e, logo abaixo, a média ao quadrado arredondada com `round(...,
          1)`.'
        solution: 'import math

