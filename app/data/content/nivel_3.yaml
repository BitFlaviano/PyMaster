concepts:
  # ────────────────────────────────────────────────────────────────
  - id: metodos_strings
    title: "Métodos de strings"
    color: "#0ea5e9"
    summary: "upper, lower, strip, replace, split e join: ferramentas para modelar textos."
    lessons:
      - id: metodos_strings_intro
        title: "Textos têm superpoderes"
        blocks:
          - type: text
            body: |
              Strings são objetos: elas trazem **métodos** prontos. O método é chamado com um ponto e parênteses:

              ```python
              nome = "ana"
              print(nome.upper())      # ANA
              print(nome.capitalize()) # Ana
              ```

              - `upper()/lower()` — letras maiúsculas/minúsculas
              - `strip()` — remove espaços das pontas
              - `replace(a, b)` — troca pedaços do texto
              - `split(sep)` — divide em uma lista
              - `join(lista)` — junta uma lista em texto
          - type: code
            code: |
              email = "  ana@exemplo.com  "
              print(email.strip().upper())
              # ANA@EXEMPLO.COM

              partes = "2026-01-12".split("-")
              print(partes)             # ['2026', '01', '12']
              print("-".join(partes))   # 2026-01-12
          - type: callout
            body: "split() divide o texto em lista; join() faz o caminho inverso — ame-os em dupla."
    exercises:
      - id: metodos_strings_1
        type: predict
        difficulty: easy
        xp: 20
        prompt: "O que será exibido?"
        code: |
          print("Python".upper())
        answer: |
          PYTHON
        hints:
          - "upper() passa tudo para maiúsculas."
        time_estimate: 45

      - id: metodos_strings_2
        type: predict
        difficulty: easy
        xp: 20
        prompt: "O que será exibido?"
        code: |
          texto = "  olá  "
          print(texto.strip() + "!")
        answer: |
          olá!
        hints:
          - "strip() remove os espaços das pontas."
          - "As aspas da variável não aparecem na saída."
        time_estimate: 60

      - id: metodos_strings_3
        type: predict
        difficulty: medium
        xp: 25
        prompt: "O que será exibido?"
        code: |
          palavras = "a,b,c".split(",")
          print(len(palavras))
        answer: |
          3
        hints:
          - "split(\",\") divide o texto onde aparece a vírgula."
          - "Resultado: ['a', 'b', 'c']."
        time_estimate: 60

      - id: metodos_strings_4
        type: complete
        difficulty: medium
        xp: 25
        prompt: |
          Complete para remover os espaços das pontas:
        code: |
          nome = "  Ana  "
          print(nome.____())
        answer: 'strip'
        hints:
          - "É o método que significa 'tirar a casca'."
        solution: |
          nome = "  Ana  "
          print(nome.strip())
        time_estimate: 90

      - id: metodos_strings_5
        type: write
        difficulty: medium
        xp: 30
        prompt: |
          Escreva um programa que junte a lista `["2026", "01", "12"]` com `"-"` e exiba o resultado.
        tests:
          - name: "Saída esperada"
            expected: |
              2026-01-12
        hints:
          - "Use \"-\".join(lista)."
          - "O separador vem ANTES do join, entre aspas."
        solution: |
          print("-".join(["2026", "01", "12"]))
        time_estimate: 120



      - id: metodos_strings_boss
        type: write
        difficulty: hard
        xp: 60
        time_estimate: 420
        prompt: 'Chefão (escreva o código): a string `"Ana Bia Carlos"` contém três nomes separados por espaço. Use `split()` para quebrá-la em uma lista e exiba, um por linha: o primeiro nome (índice 0), o último nome (índice -1) e a quantidade de nomes
          (`len()`).'
        solution: 'palavras = "Ana Bia Carlos".split()

          print(palavras[0])

          print(palavras[-1])

          print(len(palavras))

          '
        tests:
        - name: Nomes da string
          expected: 'Ana

            Carlos

            3

            '
        must_include:
        - split(
        hints:
        - split() sem argumentos divide pelos espaços.
        common_error: Esquecer os parênteses de split() e tentar fatiar a própria string.

