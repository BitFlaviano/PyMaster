  - id: modulos
    title: "Módulos e biblioteca padrão"
    color: "#a855f7"
    summary: "import traz ferramentas prontas: matemática, sorteio, estatística e muito mais."
    lessons:
      - id: modulos_intro
        title: "Não reinventar a roda"
        blocks:
          - type: text
            body: |
              O Python já vem com **milhares de funções prontas** agrupadas em módulos.

              ```python
              import math

              print(math.sqrt(144))    # 12.0
              print(math.floor(3.7))   # 3
              print(math.ceil(3.2))    # 4
              ```

              E dá para importar só uma parte:

              ```python
              from math import sqrt
              print(sqrt(16))          # 4.0
              ```
          - type: text
            body: |
              A biblioteca padrão também tem **estatística**:

              ```python
              import statistics

              notas = [7, 8, 9, 10]
              print(statistics.mean(notas))    # 8.5
              print(statistics.median([1, 2, 9]))  # 2
              ```

              E **sorteio** (aleatório):

              ```python
              import random
              print(random.choice(["a", "b", "c"]))
              ```
          - type: code
            code: |
              import statistics

              precos = [10.5, 20.0, 7.25]
              print(statistics.mean(precos))   # 12.58333...
          - type: callout
            body: "Antes de escrever uma função, pergunte: 'será que o Python já não tem isso pronto?'"
    exercises:
      - id: modulos_1
        type: predict
        difficulty: easy
        xp: 20
        prompt: "O que será exibido?"
        code: |
          import math
          print(math.floor(3.7))
        answer: |
          3
        hints:
          - "floor() arredonda para BAIXO."
          - "3.7 → 3."
        time_estimate: 60

      - id: modulos_2
        type: predict
        difficulty: medium
        xp: 25
        prompt: "O que será exibido?"
        code: |
          import math
          print(math.sqrt(144))
        answer: |
          12.0
        hints:
          - "sqrt() é a raiz quadrada."
          - "Funções de matemática costumam devolver float."
        time_estimate: 60

      - id: modulos_3
        type: complete
        difficulty: easy
        xp: 20
        prompt: |
          Complete para importar o módulo que tem a função `floor`:
        code: |
          import ____
          print(math.floor(3.7))
        answer: 'math'
        hints:
          - "É a biblioteca de MATEMÁTICA."
        solution: 'import math\nprint(math.floor(3.7))'
        time_estimate: 90

      - id: modulos_4
        type: write
        difficulty: medium
        xp: 30
        prompt: |
          Escreva um programa que exiba a **média** de `[10, 20, 30]` usando o módulo `statistics`.
        tests:
          - name: "Saída esperada"
            expected: |
              20
        hints:
          - "import statistics e use statistics.mean(lista)."
          - "Média de 10, 20, 30 → 20."
        solution: |
