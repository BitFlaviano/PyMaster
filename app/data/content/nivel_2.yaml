  - id: loops_avancados
    title: "Laços avançados"
    color: "#06b6d4"
    summary: "range, acumuladores, break e enumerate."
    lessons:
      - id: loops_avancados_01
        title: "range e acumuladores"
        blocks:
          - type: text
            body: |
              `range(inicio, fim)` gera números sem incluir o fim:
              
              ```
              total = 0
              for n in range(1, 4):
                  total += n      # 1 + 2 + 3
              print(total)        # 6
              ```

      - id: loops_avancados_02
        title: "break, continue e enumerate"
        blocks:
          - type: text
            body: |
              - `break` **interrompe** o laço imediatamente.
              - `enumerate()` devolve (índice, item) a cada volta:
              
              ```
              frutas = ["uva", "kiwi"]
              for i, fruta in enumerate(frutas):
                  print(i, fruta)
              ```
              
              Exibe `0 uva` e `1 kiwi`.

