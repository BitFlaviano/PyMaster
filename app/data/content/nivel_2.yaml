# ------------------------------------------------------------
# NÍVEL 2 — ESTRUTURAS DE DADOS E FUNÇÕES
# ------------------------------------------------------------

level: 2
slug: "nivel-2"
title: "Nível 2 — Estruturas de dados e funções"
subtitle: "Listas, tuplas, dicionários, conjuntos, funções e laços avançados."

concepts:
  - id: listas
    title: "Listas"
    color: "#6366f1"
    summary: "Sequências ordenadas e mutáveis com métodos poderosos."
    lessons:
      - id: listas_01
        title: "Listas"
        blocks:
          - type: text
            body: |
              Uma **lista** guarda vários valores em ordem, entre colchetes:
              
              ```
              numeros = [10, 20, 30]
              print(len(numeros))  # 3
              print(numeros[1])    # 20 (indice comeca em 0!)
              ```

          - type: visual
            kind: memory
            code: "indice: 0 → 10 | 1 → 20 | 2 → 30"

      - id: listas_02
        title: "Métodos de lista"
        blocks:
          - type: text
            body: |
              Listas têm métodos úteis:
              
              ```
              numeros = [10, 20]
              numeros.append(30)   # adiciona ao final
              print(sum(numeros))  # soma tudo -> 60
              ```

    exercises:


      - id: listas_1
        type: choice
        difficulty: easy
        xp: 15
        time_estimate: 60
        prompt: Qual destas é uma LISTA de números?
        options:
        - '[1, 2, 3]'
        - '{1, 2, 3}'
        - (1, 2, 3)
        - '''123'''
        answer: '0'
        hints:
        - Listas usam colchetes.

      - id: listas_2
        type: predict
        difficulty: easy
        xp: 15
        time_estimate: 90
        prompt: O que será exibido?
        code: 'print(len([10, 20, 30]))

          '
        answer: '3

          '
        hints:
        - len() conta os itens da lista.

      - id: listas_3
        type: predict
        difficulty: medium
        xp: 25
        time_estimate: 120
        prompt: O que será exibido?
        code: 'print(["a", "b"][1])

          '
        answer: 'b

          '
        hints:
        - O índice 1 é o SEGUNDO item, porque a contagem começa em 0.

      - id: listas_4
        type: choice
        difficulty: medium
        xp: 25
        time_estimate: 90
        prompt: O que o método .append() faz em uma lista?
        options:
        - Adiciona um item ao final da lista
        - Remove o primeiro item
        - Ordena a lista
        - Embaraça a lista
        answer: '0'
        hints:
        - append = acrescentar (anel junto ao final).

      - id: listas_5
        type: write
        difficulty: medium
        xp: 30
        time_estimate: 180
        prompt: Exiba a soma dos elementos da lista `[4, 8, 15]`.
        tests:
        - name: Soma da lista
          expected: '27

            '
        solution: 'numeros = [4, 8, 15]

          print(sum(numeros))

          '
        hints:
        - sum() soma todos os itens de uma vez.

      - id: listas_6
        type: predict
        difficulty: easy
        xp: 20
        time_estimate: 120
        prompt: Leia o código e diga o que será exibido na tela (apenas a linha impressa).
        code: 'frutas = ["uva", "pera"]

          frutas.append("manga")

          print(frutas)

          '
        answer: '[''uva'', ''pera'', ''manga'']

          '
        hints:
        - append adiciona um item ao final da lista.

      - id: listas_boss
        type: write
        difficulty: hard
        xp: 55
        time_estimate: 420
        prompt: 'Chefão (escreva o código): dado o vetor `[3, 8, 1, 12, 5]`, descubra o maior valor usando um laço `for` que percorre a lista elemento por elemento. Comece o maior com o primeiro valor e atualize-o sempre que encontrar um número maior.
          No final, exiba o maior valor.'
        solution: "numeros = [3, 8, 1, 12, 5]\nmaior = numeros[0]\nfor n in numeros:\n    if n > maior:\n        maior = n\nprint(maior)\n"
        tests:
        - name: Maior da lista
          expected: '12

            '
        must_include:
        - 'for '
        hints:
        - A variável maior precisa iniciar com o primeiro elemento.
        common_error: Usar max([3, 8, 1, 12, 5]), o que burla o objetivo do exercício.

      - id: listas_lp_append
        type: predict
        difficulty: easy
        xp: 15
        time_estimate: 60
        prompt: 'Do learnpython.org (Lists): como as listas crescem com append? O que sera
          exibido?'
        code: "mylist = []\nmylist.append(1)\nmylist.append(2)\nmylist.append(3)\nprint(mylist[0])\n\
          print(mylist[1])\nprint(mylist[2])\nfor x in mylist:\n    print(x)\n"
        answer: '1

          2

          3

          1

          2

          3

          '
        hints:
        - A lista comeca vazia e ganha itens com append.
        - Os indices em Python comecam em 0.
      - id: listas_lp_exercicio
        type: write
        difficulty: medium
        xp: 40
        time_estimate: 240
        prompt: 'Exercicio do learnpython.org (Lists): use append para colocar os numeros
          1, 2, 3 na lista numbers e as palavras "hello" e "world" na lista strings. Preencha
          second_name com o segundo nome de names (indice 1) e rode o codigo de teste.'
        solution: 'numbers = []

          strings = []

          names = ["John", "Eric", "Jessica"]

          numbers.append(1)

          numbers.append(2)

          numbers.append(3)

          strings.append("hello")

          strings.append("world")

          second_name = names[1]

          print(numbers)

          print(strings)

          print("The second name on the names list is %s" % second_name)

          '
        tests:
        - name: Saida esperada
          expected: '[1, 2, 3]

            [''hello'', ''world'']

            The second name on the names list is Eric

            '
        must_include:
        - append
        hints:
        - O segundo item (Eric) esta no indice 1, porque a contagem comeca em 0.

  - id: tuplas
    title: "Tuplas"
    color: "#10b981"
    summary: "Sequências imutáveis — seguras para dados fixos."
    lessons:
      - id: tuplas_intro
        title: "Tuplas"
        blocks:
          - type: text
            body: |
              Uma **tupla** é como uma lista, mas **imutável**: depois de criada não muda.
              
              ```
              ponto = (10, 20)
              print(ponto[0])  # 10
              
              a, b = ponto       # desempacota: a=10, b=20
              print(a + b)       # 30
              ```

          - type: callout
            body: "Use tuplas para dados que não devem mudar, como coordenadas."

    exercises:


      - id: tuplas_1
        type: choice
        difficulty: easy
        xp: 15
        time_estimate: 60
        prompt: Qual é a principal diferença entre tupla e lista?
        options:
        - A tupla é imutável (não muda após criada)
        - A tupla é mais rápida de digitar
        - A tupla aceita qualquer ordem
        - A tupla não aceita números
        answer: '0'
        hints:
        - Tuplas não têm append nem podem ser alteradas.

      - id: tuplas_2
        type: predict
        difficulty: easy
        xp: 15
        time_estimate: 90
        prompt: O que será exibido?
        code: 'print((1, 2, 3)[2])

          '
        answer: '3

          '
        hints:
        - 'Indexação funciona igual à lista: índice 2 é o terceiro item.'

      - id: tuplas_3
        type: predict
        difficulty: medium
        xp: 25
        time_estimate: 120
        prompt: O que será exibido?
        code: 'a, b = (2, 3)

          print(a + b)

          '
        answer: '5

          '
        hints:
        - O desempacotamento coloca 2 em a e 3 em b.

      - id: tuplas_4
        type: write
        difficulty: medium
        xp: 30
        time_estimate: 180
        prompt: Dada a tupla `ponto = (10, 20)`, exiba a soma das coordenadas.
        tests:
        - name: Coordenadas
          expected: '30

            '
        solution: 'ponto = (10, 20)

          print(ponto[0] + ponto[1])

          '
        hints:
        - ponto[0] é 10 e ponto[1] é 20.

      - id: tuplas_6
        type: predict
        difficulty: easy
        xp: 20
        time_estimate: 120
        prompt: Leia o código e diga o que será exibido na tela (duas linhas).
        code: 'coordenadas = (4, 5)

          print(coordenadas[0])

          print(len(coordenadas))

          '
        answer: '4

          2

          '
        hints:
        - Tuplas também aceitam indexação e len().

      - id: tuplas_boss
        type: write
        difficulty: hard
        xp: 55
        time_estimate: 420
        prompt: 'Chefão (escreva o código): um ponto no plano cartesiano é a tupla `(10, 20)`. Desempacote-a nas variáveis `x` e `y` e exiba, um por linha, a soma `x + y` e o produto `x * y`.'
        solution: 'ponto = (10, 20)

          x, y = ponto

          print(x + y)

          print(x * y)

          '
        tests:
        - name: Soma e produto
          expected: '30

            200

            '
        must_include:
        - x, y =
        hints:
        - O desempacotamento exige a mesma quantidade de elementos da tupla.
        common_error: Tentar modificar a tupla depois de criada (TypeError).

  - id: dicionarios
    title: "Dicionários"
    color: "#f59e0b"
    summary: "Pares chave-valor para organizar informações."
    lessons:
      - id: dicionarios_01
        title: "Dicionários"
        blocks:
          - type: text
            body: |
              Um **dicionário** guarda pares **chave: valor**, entre chaves:
              
              ```
              d = {"nome": "Ana", "idade": 15}
              print(d["nome"])     # Ana
              print(d.get("cidade", 0))  # 0 (chave nao existe)
              ```

          - type: visual
            kind: frame
            code: "chave: nome → Ana | chave: idade → 15"

      - id: dicionarios_02
        title: "Percorrendo dicionários"
        blocks:
          - type: text
            body: |
              `.keys()`, `.values()` e `.items()` acessam as partes do dicionário:
              
              ```
              estoque = {"caneta": 2, "caderno": 5}
              print(estoque.keys())    # dict_keys(['caneta', 'caderno'])
              print(sum(estoque.values()))  # 7
              ```

    exercises:


      - id: dicionarios_1
        type: choice
        difficulty: easy
        xp: 15
        time_estimate: 60
        prompt: Qual destas é a forma correta de criar um dicionário?
        options:
        - '{"nome": "Ana"}'
        - '["nome" : "Ana"]'
        - ("nome" => "Ana")
        - '"nome Ana"'
        answer: '0'
        hints:
        - 'Dicionários usam chaves e pares chave: valor.'

      - id: dicionarios_2
        type: predict
        difficulty: easy
        xp: 15
        time_estimate: 90
        prompt: O que será exibido?
        code: 'd = {"a": 1}

          print(d["a"])

          '
        answer: '1

          '
        hints:
        - O colchete recebe a CHAVE e devolve o valor.

      - id: dicionarios_3
        type: predict
        difficulty: medium
        xp: 25
        time_estimate: 120
        prompt: O que será exibido?
        code: 'd = {"x": 10, "y": 20}

          print(d.get("z", 0))

          '
        answer: '0

          '
        hints:
        - .get devolve o padrão (0) quando a chave 'z' não existe.

      - id: dicionarios_4
        type: choice
        difficulty: medium
        xp: 25
        time_estimate: 90
        prompt: O que d.keys() devolve?
        options:
        - As chaves do dicionário
        - Os valores do dicionário
        - O tamanho da string
        - A soma dos valores
        answer: '0'
        hints:
        - keys() lista as 'etiquetas' do dicionário.

      - id: dicionarios_5
        type: write
        difficulty: medium
        xp: 30
        time_estimate: 180
        prompt: 'Some e exiba os valores do dicionário `{"caneta": 2, "caderno": 5}`.'
        tests:
        - name: Total do estoque
          expected: '7

            '
        solution: 'estoque = {"caneta": 2, "caderno": 5}

          print(sum(estoque.values()))

          '
        hints:
        - values() devolve os valores; sum soma.

      - id: dicionarios_6
        type: predict
        difficulty: easy
        xp: 20
        time_estimate: 150
        prompt: Leia o código e diga o que será exibido na tela (duas linhas).
        code: 'aluno = {"nome": "Ana", "nota": 9}

          print(aluno["nota"])

          print(aluno.get("turma", "sem turma"))

          '
        answer: '9

          sem turma

          '
        hints:
        - get devolve o valor ou o padrão quando a chave não existe.

      - id: dicionarios_boss
        type: write
        difficulty: hard
        xp: 55
        time_estimate: 420
        prompt: 'Chefão (escreva o código): o estoque de uma papelaria é o dicionário `{"caneta": 12, "caderno": 3, "borracha": 8}` (produto: quantidade). Percorra o dicionário somando as quantidades e exiba o total de itens em estoque. Use um laço `for`
          sobre as chaves.'
        solution: "estoque = {\"caneta\": 12, \"caderno\": 3, \"borracha\": 8}\ntotal = 0\nfor item in estoque:\n    total += estoque[item]\nprint(total)\n"
        tests:
        - name: Total no estoque
          expected: '23

            '
        must_include:
        - 'for '
        hints:
        - Iterar sobre o dicionário devolve as chaves; use-as para acessar os valores.
        common_error: Somar as chaves (strings) em vez dos valores inteiros.

      - id: dicionarios_lp_pop
        type: predict
        difficulty: easy
        xp: 15
        time_estimate: 60
        prompt: 'Do learnpython.org (Dictionaries): como remover uma chave com pop? O que
          sera exibido?'
        code: 'phonebook = {"John": 938477566, "Jack": 938377264, "Jill": 947662781}

          phonebook.pop("John")

          print(phonebook)

          print(len(phonebook))

          '
        answer: '{''Jack'': 938377264, ''Jill'': 947662781}

          2

          '
        hints:
        - pop remove a chave e devolve o valor.
        - len(dicionario) conta quantas chaves restaram.
      - id: dicionarios_lp_exercicio
        type: write
        difficulty: medium
        xp: 40
        time_estimate: 240
        prompt: 'Exercicio do learnpython.org (Dictionaries): adicione "Jake" com o telefone
          938273443 ao phonebook e remova "Jill".'
        solution: "phonebook = {\"John\": 938477566, \"Jack\": 938377264, \"Jill\": 947662781}\n\
          phonebook[\"Jake\"] = 938273443\ndel phonebook[\"Jill\"]\nif \"Jake\" in phonebook:\n\
          \    print(\"Jake is listed in the phonebook.\")\nif \"Jill\" not in phonebook:\n\
          \    print(\"Jill is not listed in the phonebook.\")\n"
        tests:
        - name: Saida esperada
          expected: 'Jake is listed in the phonebook.

            Jill is not listed in the phonebook.

            '
        must_include:
        - phonebook["Jake"]
        - del phonebook["Jill"]
        hints:
        - phonebook[chave] = valor cria ou atualiza.
        - del dicionario[chave] remove a entrada.

  - id: conjuntos
    title: "Conjuntos"
    color: "#ef4444"
    summary: "Valores únicos e operações como interseção."
    lessons:
      - id: conjuntos_intro
        title: "Conjuntos"
        blocks:
          - type: text
            body: |
              Um **conjunto** (`set`) guarda valores **sem repetição** e sem ordem, entre chaves:
              
              ```
              a = {1, 2, 3}
              b = {2, 3, 4}
              print(len({1, 2, 2, 3}))  # 3 (o 2 repetido nao conta)
              print(4 in a)              # False
              print(a & b)               # {2, 3} (intersecao)
              ```

    exercises:


      - id: conjuntos_1
        type: choice
        difficulty: easy
        xp: 15
        time_estimate: 60
        prompt: Qual destes é um CONJUNTO (set)?
        options:
        - '{1, 2, 3}'
        - '[1, 2, 3]'
        - (1, 2, 3)
        - '{"a": 1}'
        answer: '0'
        hints:
        - 'Conjuntos usam chaves, mas sem chave: valor.'

      - id: conjuntos_2
        type: predict
        difficulty: easy
        xp: 15
        time_estimate: 90
        prompt: O que será exibido?
        code: 'print(len({1, 2, 2, 3}))

          '
        answer: '3

          '
        hints:
        - 'Conjuntos não repetem valores: 2 conta uma vez só.'

      - id: conjuntos_3
        type: predict
        difficulty: medium
        xp: 25
        time_estimate: 120
        prompt: O que será exibido?
        code: 'print(4 in {1, 2, 3})

          '
        answer: 'False

          '
        hints:
        - in pergunta se o número está no conjunto — 4 não está.

      - id: conjuntos_4
        type: write
        difficulty: medium
        xp: 30
        time_estimate: 180
        prompt: Dados `a = {1, 2, 3}` e `b = {2, 3, 4}`, exiba a interseção (`&`).
        tests:
        - name: Interseção
          expected: '{2, 3}

            '
        solution: 'a = {1, 2, 3}

          b = {2, 3, 4}

          print(a & b)

          '
        hints:
        - '& devolve apenas os elementos que existem nos dois conjuntos.'

      - id: conjuntos_6
        type: predict
        difficulty: easy
        xp: 20
        time_estimate: 120
        prompt: Leia o código e diga o que será exibido na tela (duas linhas).
        code: 's = {1, 2, 3}

          print(2 in s)

          print(9 in s)

          '
        answer: 'True

          False

          '
        hints:
        - O operador in verifica se o elemento pertence ao conjunto.

      - id: conjuntos_boss
        type: write
        difficulty: hard
        xp: 55
        time_estimate: 420
        prompt: 'Chefão (escreva o código): temos os conjuntos `a = {1, 2, 3, 4}` e `b = {3, 4, 5}`. Exiba, um por linha: a quantidade de elementos da união (`|`) e a quantidade de elementos da interseção (`&`).'
        solution: 'a = {1, 2, 3, 4}

          b = {3, 4, 5}

          print(len(a | b))

          print(len(a & b))

          '
        tests:
        - name: União e interseção
          expected: '5

            2

            '
        must_include:
        - '|'
        hints:
        - A união junta sem repetir; a interseção guarda só o que existe nos dois.
        common_error: Confundir união com soma das listas, contando 3 e 4 duas vezes.

      - id: conjuntos_lp_ops
        type: predict
        difficulty: medium
        xp: 25
        time_estimate: 90
        prompt: 'Do learnpython.org (Sets): operacoes entre conjuntos. O que sera exibido?
          (usamos sorted para ter ordem estavel)'
        code: 'a = set(["Jake", "John", "Eric"])

          b = set(["John", "Jill"])

          print(sorted(a.intersection(b)))

          print(sorted(a.union(b)))

          print(sorted(a.difference(b)))

          '
        answer: '[''John'']

          [''Eric'', ''Jake'', ''Jill'', ''John'']

          [''Eric'', ''Jake'']

          '
        hints:
        - intersection = quem esta nos dois; union = todos; difference = so de a.
      - id: conjuntos_lp_exercicio
        type: write
        difficulty: medium
        xp: 40
        time_estimate: 240
        prompt: 'Exercicio do learnpython.org (Sets): use as listas dadas e exiba o conjunto
          com todos os participantes do evento A que NAO foram ao evento B (A.difference(B)).'
        solution: 'a = ["Jake", "John", "Eric"]

          b = ["John", "Jill"]

          A = set(a)

          B = set(b)

          print(sorted(A.difference(B)))

          '
        tests:
        - name: Saida esperada
          expected: '[''Eric'', ''Jake'']

            '
        must_include:
        - difference
        hints:
        - A.difference(B) devolve os elementos de A que nao estao em B.
        - sorted garante ordem estavel na saida.

  - id: funcoes
    title: "Funções"
    color: "#8b5cf6"
    summary: "Empacote código em blocos reutilizáveis com def."
    lessons:
      - id: funcoes_01
        title: "Definindo funções"
        blocks:
          - type: text
            body: |
              Uma **função** embrulha um bloco de código para reutilizar, com `def`:
              
              ```
              def dobro(n):
                  return n * 2
              
              print(dobro(5))  # 10
              ```

          - type: visual
            kind: sequence
            code: "chamada dobro(5) → n=5 → return 10 → print 10"

      - id: funcoes_02
        title: "return vs print"
        blocks:
          - type: text
            body: |
              `return` devolve o resultado para quem chamou; `print` apenas exibe:
              
              ```
              def oi():
                  print("oi")
              
              print(oi())   # mostra 'oi' e depois None
              ```

          - type: callout
            body: "Função sem return devolve None — o 'nada' de Python."

    exercises:


      - id: funcoes_1
        type: choice
        difficulty: easy
        xp: 15
        time_estimate: 60
        prompt: Qual palavra-chave define uma função?
        options:
        - def
        - fun
        - func
        - define
        answer: '0'
        hints:
        - 'def dupla: definition (definição).'

      - id: funcoes_2
        type: complete
        difficulty: easy
        xp: 20
        time_estimate: 90
        prompt: "Complete para a função retornar o dobro de n:\n`def dobro(n):\n    return n * ____`"
        answer: '2'
        hints:
        - O dobro de n é n vezes 2.

      - id: funcoes_3
        type: predict
        difficulty: easy
        xp: 15
        time_estimate: 90
        prompt: O que será exibido?
        code: "def soma(a, b):\n    return a + b\n\nprint(soma(2, 3))\n"
        answer: '5

          '
        hints:
        - A função retorna 2 + 3 e o print mostra esse valor.

      - id: funcoes_4
        type: predict
        difficulty: medium
        xp: 25
        time_estimate: 120
        prompt: O que será exibido? (duas linhas)
        code: "def oi():\n    print(\"oi\")\n\nprint(oi())\n"
        answer: 'oi

          None

          '
        hints:
        - A função imprime 'oi', mas não retorna nada — e o print(oi()) mostra None.

      - id: funcoes_5
        type: write
        difficulty: medium
        xp: 30
        time_estimate: 180
        prompt: Crie a função `media(a, b)` que retorna a média de dois números e exiba `media(7, 9)`.
        tests:
        - name: Média com função
          expected: '8.0

            '
        solution: "def media(a, b):\n    return (a + b) / 2\n\nprint(media(7, 9))\n"
        hints:
        - Retorne a soma dividida por 2.

      - id: funcoes_6
        type: predict
        difficulty: easy
        xp: 20
        time_estimate: 150
        prompt: Leia o código e diga o que será exibido na tela (duas linhas).
