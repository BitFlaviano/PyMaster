        blocks:
          - type: text
            body: |
              O filtro é a ferramenta mais usada do pandas. Dentro dos colchetes vai uma **condição por coluna**:

              ```python
              import pandas as pd

              df = pd.read_csv(DATASETS_DIR + "/vendas.csv")
              online = df[df["canal"] == "online"]
              print(len(online))        # 451

              caros = df[df["total"] > 500]
              mixed = df[(df["canal"] == "loja") & (df["quantidade"] > 3)]
              ```
          - type: code
            code: |
