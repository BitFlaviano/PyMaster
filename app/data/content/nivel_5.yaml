              O **DataFrame** é a tabela do pandas: linhas × colunas. O `read_csv` transforma o arquivo **CSV** direto em DataFrame:

              ```python
              import pandas as pd

              df = pd.read_csv(DATASETS_DIR + "/vendas.csv")
              print(len(df))     # 1200 (nº de linhas)
              print(df.shape)    # (1200, 8)
