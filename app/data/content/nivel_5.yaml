    lessons:
      - id: numpy_intro
        title: "Arrays: matemática em lote"
        blocks:
          - type: text
            body: |
              O **NumPy** é o motor numérico do Python. Ele trabalha com **arrays** — tabelas numéricas — e aplica operações a **todos os valores de uma vez**:

              ```python
              import numpy as np

              a = np.array([1, 2, 3])
              b = a + 10            # soma 10 em cada item
              print(b)              # [11 12 13]
              print(np.arange(5))   # [0 1 2 3 4]
              ```
          - type: code
            code: |
              import numpy as np

              notas = np.array([8, 9, 10, 7])
              print(np.mean(notas))   # 8.5
              print(notas ** 2)       # [64 81 100  49]
          - type: visual
            kind: memory
            code: |
              a = np.array([1, 2, 3])
              a + 10 → array([11, 12, 13])
              np.arange(5) → array([0, 1, 2, 3, 4])
          - type: callout
            body: "O pandas (próximo passo) é construído em cima do NumPy. Dominar np.array é meio caminho andado."
