        prompt: 'Chefão (escreva o código): antes de criar um gráfico de barras por canal de vendas, é preciso preparar os dados. Leia `vendas.csv`, agrupe por canal somando o total e ordene do maior para o menor com `sort_values(ascending=False)`. Exiba,
