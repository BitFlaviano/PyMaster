    lessons:
      - id: estatisticas_intro
        title: "Resumir para decidir"
        blocks:
          - type: text
            body: |
              Uma coluna inteira vira um único número:

              ```python
              import pandas as pd

              notas = pd.read_csv(DATASETS_DIR + "/notas.csv")
              print(round(notas["media"].mean(), 2))   # 5.95
              ```

              Métricas que respondem perguntas de negócio:

              - `max()/min()` → o extremo (maior venda, menor salário)
              - `mean()` → o meio do caminho
              - `median()` → o valor do meio (imune a extremos)
              - `count()` / `len()` → quantos temos
          - type: code
            code: |
              import pandas as pd

              clientes = pd.read_csv(DATASETS_DIR + "/clientes.csv")
              print(clientes["renda"].max())          # 14984
              print(round(clientes["renda"].mean(), 2))  # 8522.74
          - type: dataset_note
            body: |
              Média vs mediana: a média é puxada pelos extremos; a mediana sempre divide a lista ao meio. Por isso salários costumam ser resumidos pela **mediana**.
          - type: callout
            body: "round(valor, 2) evita as famosas dízimas. mean() de pandas já é float; a formatação é com você."
