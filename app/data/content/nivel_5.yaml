  # ────────────────────────────────────────────────────────────────
  - id: series
    title: "Series do pandas"
    color: "#0d9488"
    summary: "Uma coluna de dados com nome, índice e funções estatísticas prontas."
    lessons:
      - id: series_intro
        title: "Uma coluna de dados"
        blocks:
          - type: text
            body: |
              Uma **Series** é uma coluna de dados significada pelo pandas:

              ```python
              import pandas as pd

              notas = pd.Series([8, 9, 7])
              print(notas.mean())   # 8.0
              print(notas.max())    # 9
              print(notas.sum())    # 24
              ```

              Dá para dar nome ao índice:

              ```python
              vendas = pd.Series([100, 200], index=["jan", "fev"])
              print(vendas["fev"])   # 200
              ```
          - type: visual
            kind: memory
            code: |
              notas = pd.Series([8, 9, 7])
              mean() → 8.0  max() → 9  min() → 7
              notas["fev"] → acessa pelo índice nomeado
          - type: callout
            body: "Literalmente: Series ≈ uma coluna; DataFrame ≈ uma tabela cheia. Você está no caminho."
