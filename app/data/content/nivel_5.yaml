  # ────────────────────────────────────────────────────────────────
  - id: visualizacao
    title: "Visualização de dados"
    color: "#f59e0b"
    summary: "Um gráfico vale mil tabelas: matplotlib para dar forma aos números."
    lessons:
      - id: visualizacao_intro
        title: "Dos números ao gráfico"
        blocks:
          - type: text
            body: |
              O **matplotlib** é a biblioteca clássica de gráficos do Python:

              ```python
              import matplotlib.pyplot as plt

              plt.plot([1, 2, 3], [10, 20, 15])   # linha
              plt.show()
              ```

              Padrões da análise de dados:

              - **linha** → evolução no tempo
              - **barras** → comparar categorias
              - **histograma** → distribuição de uma coluna
              - **dispersão (scatter)** → relação entre duas colunas numéricas
          - type: visual
            kind: memory
            code: |
              plt.plot(x, y) → gráfico de linha
              plt.bar(cat, val) → barras
              plt.hist(dados) → histograma
              plt.scatter(x, y) → dispersão
              plt.show() → exibe o gráfico
          - type: callout
            body: "Regra de ouro: linha para tempo, barras para comparação, histograma para distribuição, scatter para relação."
    exercises:
