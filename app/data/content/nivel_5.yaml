  # ────────────────────────────────────────────────────────────────
  - id: pandas_agregacao
    title: "Agrupando com groupby"
    color: "#7c3aed"
    summary: "value_counts, groupby e sum: transforme milhares de linhas em uma resposta."
    lessons:
      - id: pandas_agregacao_intro
        title: "Dado bruto virando resposta"
        blocks:
          - type: text
            body: |
              **value_counts()** conta quantas vezes cada valor aparece:

              ```python
              import pandas as pd

              df = pd.read_csv(DATASETS_DIR + "/vendas.csv")
              print(df["canal"].value_counts())
              print(df["canal"].value_counts().iloc[0])   # 491 (canal mais comum)
              ```

              **groupby** agrupa e aplica uma função ao grupo:

              ```python
              por_canal = df.groupby("canal")["total"].sum()
              print(por_canal)             # total de vendas por canal
              print(por_canal.max())       # maior total entre os canais
              ```
          - type: code
            code: |
              import pandas as pd

              df = pd.read_csv(DATASETS_DIR + "/vendas.csv")
              print(df.groupby("canal").size())   # contagem por canal
          - type: visual
            kind: pipeline
            code: |
              groupby("canal") → ["total"].sum() → comparar canais
          - type: callout
            body: "value_counts ordena do mais para o menos frequente. Era o mesmo Counter que você já conhece — só que em escala de dataframe."
    exercises:
      - id: pandas_agregacao_1
        type: predict
        difficulty: medium
        xp: 25
        prompt: "O que será exibido?"
        code: |
