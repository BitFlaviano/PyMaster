          print("2. processar")
          print("3. gerar relatorio")
        must_include:
          - coletar dados
        time_estimate: 120

  # ────────────────────────────────────────────────────────────────
  - id: auto_caminhos
    title: "Arquivos, pastas e caminhos"
    color: "#84cc16"
    goals: ["automacao"]
    summary: "Navegar por caminhos com pathlib sem se perder entre barras e extensões."
    lessons:
      - id: auto_caminhos_intro
        title: "O endereço do arquivo"
        blocks:
          - type: text
            body: |
              Todo arquivo tem um **caminho**. O módulo `pathlib` transforma caminhos em objetos com nome, extensão e partes:

              ```python
              from pathlib import Path

              p = Path("dados/2026/vendas.csv")
              print(p.name)      # vendas.csv
              print(p.suffix)    # .csv
              print(p.stem)      # vendas
              print(p.parts)     # ('dados', '2026', 'vendas.csv')
              ```

              Ler partes do caminho evita erros de digitação em texto puro.
          - type: text
            body: |
              Para **mover, copiar e renomear** arquivos a automação usa `shutil` (no sandbox web o acesso é restrito — aqui focamos em ler nomes e caminhos com segurança):

              ```python
              import shutil
              shutil.move("origem.txt", "pasta_destino/")
              ```
          - type: callout
            body: "Estratégia clássica: Downloads → pastas por tipo/ano. pathlib lê o caminho, shutil move o arquivo."
    exercises:
      - id: auto_caminhos_1
        type: predict
        difficulty: easy
        xp: 20
        prompt: "O que será exibido?"
        code: |
          from pathlib import Path

          p = Path("planilha.xlsx")
          print(p.name)
          print(p.suffix)
          print(p.stem)
        answer: |
          planilha.xlsx
          .xlsx
          planilha
        hints:
          - "name tem extensão; suffix é só a extensão; stem é o nome sem extensão."
        time_estimate: 90

      - id: auto_caminhos_2
        type: predict
        difficulty: medium
        xp: 25
        prompt: "O que será exibido?"
        code: |
          from pathlib import Path

          p = Path("caixa/entrada/fotos")
          print(p.parts)
        answer: |
          ('caixa', 'entrada', 'fotos')
        hints:
          - "parts separa o caminho em uma tupla."
        time_estimate: 60

      - id: auto_caminhos_3
        type: complete
        difficulty: easy
        xp: 15
        prompt: |
          Complete com o atributo do `pathlib` que devolve a extensão do arquivo:
        code: |
          from pathlib import Path

          p = Path("nota.txt")
          print(p.____)
        answer: 'suffix'
        hints:
          - "Em inglês, 'sufixo'."
        time_estimate: 45

      - id: auto_caminhos_4
        type: choice
        difficulty: medium
        xp: 20
        prompt: Qual módulo move, copia e renomeia arquivos em uma automação?
        options:
        - pathlib
        - shutil
        - datetime
        - random
        answer: '1'
        hints:
        - "Path lê caminhos; shutil mexe nos arquivos."
        time_estimate: 60

      - id: auto_caminhos_5
        type: write
        difficulty: medium
        xp: 30
        prompt: |
          Escreva um programa que crie o caminho `Path("dados/2026/vendas.csv")` e exiba as partes dele com `parts`.
        tests:
          - name: "Partes"
            expected: |
              ('dados', '2026', 'vendas.csv')
        hints:
          - "from pathlib import Path; print(Path('dados/2026/vendas.csv').parts)"
        solution: |
          from pathlib import Path

          caminho = Path("dados/2026/vendas.csv")
          print(caminho.parts)
        must_include:
          - parts
        allow_imports:
          - pathlib
        time_estimate: 120

      - id: auto_caminhos_6
        type: order
        difficulty: medium
        xp: 25
        prompt: Ordene os passos de uma rotina que organiza a pasta Downloads por tipo.
        lines:
        - Ler o nome de cada arquivo
        - Descobrir a extensão (suffix)
