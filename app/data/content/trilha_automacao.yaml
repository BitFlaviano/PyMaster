  # ────────────────────────────────────────────────────────────────
  - id: auto_documentos
    title: "Automação de documentos"
    color: "#f97316"
    goals: ["automacao"]
    summary: "Gerar dezenas de documentos iguais trocando só os dados no meio."
    lessons:
      - id: auto_documentos_intro
        title: "Modelos que se preenchem"
        blocks:
          - type: text
            body: |
              Relatórios, contratos e faturas seguem um **modelo** (template) com buracos que o código preenche:

              ```python
              modelo = "Ola {nome}, sua fatura vence em {data}."
              texto = modelo.replace("{nome}", "Ana").replace("{data}", "10/03")
              print(texto)
              # Ola Ana, sua fatura vence em 10/03.
              ```

              Com um laço você gera **N documentos** a partir da mesma plantilha:
              ```python
              for cliente in clientes:
                  gerar_fatura(cliente)
              ```
          - type: callout
            body: "Se você repete 'preencher o mesmo documento' todo dia, você tem um modelo esperando por um for."
    exercises:
      - id: auto_documentos_1
        type: predict
        difficulty: easy
        xp: 20
        prompt: "O que será exibido?"
        code: |
          modelo = "Ola {nome}, sua fatura vence em {data}."
          print(modelo.replace("{nome}", "Ana").replace("{data}", "10/03"))
        answer: |
          Ola Ana, sua fatura vence em 10/03.
        hints:
          - "replace troca cada trecho marcado."
        time_estimate: 90

      - id: auto_documentos_2
        type: choice
        difficulty: medium
        xp: 20
        prompt: Como gerar 50 faturas a partir do mesmo modelo, só trocando o cliente?
        options:
        - Um laço (for) que preenche o modelo para cada cliente.
        - Digitando as 50 na mão.
        - Copiando e colando com Ctrl+C/Ctrl+V.
        - Reinstalando o Word 50 vezes.
        answer: '0'
        hints:
        - "for cliente in clientes: modelo.preencher(cliente)."
        time_estimate: 60

      - id: auto_documentos_3
        type: complete
        difficulty: easy
        xp: 15
        prompt: |
          Complete com o método que troca um trecho de texto por outro:
        code: |
          texto.____("{nome}", "Ana")
        answer: 'replace'
        hints:
        - "replace = substituir."
        time_estimate: 45

      - id: auto_documentos_4
        type: write
        difficulty: medium
        xp: 30
        prompt: |
          Complete o modelo para exibir "Fatura de Bia = 120 reais" usando `replace`.
        code: |
          modelo = "Fatura de {nome} = {valor} reais"
          print(____)
        tests:
          - name: "Fatura"
            expected: |
              Fatura de Bia = 120 reais
        hints:
          - "modelo.replace('{nome}', 'Bia').replace('{valor}', '120')"
        solution: |
          modelo = "Fatura de {nome} = {valor} reais"
          print(modelo.replace("{nome}", "Bia").replace("{valor}", "120"))
        must_include:
          - replace
        time_estimate: 120

  # ────────────────────────────────────────────────────────────────
  - id: auto_email
    title: "E-mail e notificações"
    color: "#ef4444"
    goals: ["automacao"]
    summary: "Avisar quando um processo termina: relatórios, erros e resumos por e-mail."
    lessons:
      - id: auto_email_intro
        title: "Emails que saem sozinhos"
        blocks:
          - type: text
            body: |
              O módulo `smtplib` + `email.message` monta e enviam e-mails de dentro do Python:

              ```python
              import smtplib
              from email.message import EmailMessage

              msg = EmailMessage()
              msg["Subject"] = "Backup terminou"
              msg.set_content("Tudo certo!")
              smtp = smtplib.SMTP("smtp.exemplo.com", 587)
              smtp.send_message(msg)
              ```

              Na prática, uma função que "envia" resume a ideia (no sandbox a rede é bloqueada):
              ```python
