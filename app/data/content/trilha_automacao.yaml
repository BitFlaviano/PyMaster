        - Mover cada arquivo para a sua pasta
        hints:
        - "Primeiro descobrir, depois criar e mover."
        time_estimate: 120

  # ────────────────────────────────────────────────────────────────
  - id: auto_texto
    title: "Leitura e escrita de dados"
    color: "#14b8a6"
    goals: ["automacao"]
    summary: "Textos em arquivos: abrir com `with`, definir o encoding e processar o conteúdo."
    lessons:
      - id: auto_texto_intro
        title: "Trabalhar com textos"
        blocks:
          - type: text
            body: |
              No Python, o bloco `with open(...) as f` abre um arquivo e **garante que ele seja fechado** — mesmo se algo der erro no meio:

              ```python
              with open("dados.txt", "r", encoding="utf-8") as f:
                  conteudo = f.read()
              ```

              Modos: `"r"` leitura, `"w"` escrita, `"a"` adicionar. (No sandbox web a escrita em arquivos é bloqueada; pensamos a leitura e o processamento.)
          - type: text
            body: |
              O **encoding** define como os caracteres são codificados. Quase tudo hoje usa **UTF-8** — sem ele, acentos viram símbolos estranhos.

              Processar conteúdo em memória é o mesmo conceito:
              ```python
              texto = "maca,3\nbanana,2"
              for linha in texto.splitlines():
                  print(linha.replace(",", ":"))
              ```
          - type: callout
            body: "with fecha o arquivo sozinho. Depois do bloco with, o arquivo já pode ser movido/renomeado por outro programa."
    exercises:
      - id: auto_texto_1
        type: choice
        difficulty: easy
        xp: 15
        prompt: Para que serve o bloco `with ... as f` ao abrir um arquivo?
        options:
        - Garantir que o arquivo seja fechado, mesmo com erro.
        - Deixar o código mais lento.
        - Impedir a leitura.
        - Trocar o nome do arquivo.
        answer: '0'
        hints:
        - "O with cuida da limpeza automaticamente."
        time_estimate: 60

      - id: auto_texto_2
        type: complete
        difficulty: easy
        xp: 15
        prompt: |
          Complete com o modo de abertura (letra) para apenas LER o arquivo:
        code: |
          with open("dados.txt", "____", encoding="utf-8") as f:
              conteudo = f.read()
        answer: 'r'
        hints:
        - "r de read."
        time_estimate: 45

      - id: auto_texto_3
        type: predict
        difficulty: medium
        xp: 25
        prompt: "O que será exibido?"
        code: |
          texto = "maca,3\nbanana,2"
          for linha in texto.splitlines():
              print(linha.replace(",", ":"))
        answer: |
          maca:3
          banana:2
        hints:
          - "splitlines separa por linha; replace troca ',' por ':'."
        time_estimate: 90

      - id: auto_texto_4
        type: choice
        difficulty: medium
        xp: 20
        prompt: Qual encoding usar para acentuação (ã, ç, é) parar de virar lixo?
        options:
        - utf-8
        - ascii
        - base64
        - binário puro
        answer: '0'
        hints:
        - "UTF-8 cobre os caracteres do português."
        time_estimate: 60

      - id: auto_texto_5
        type: write
        difficulty: medium
        xp: 30
        prompt: |
          Escreva um programa que receba o texto abaixo e o exiba transformado em MAIÚSCULAS, linha por linha (use `splitlines` e `upper`).
        code: |
          texto = "primeira linha\nsegunda linha"
        tests:
          - name: "Caixa alta"
            expected: |
              PRIMEIRA LINHA
              SEGUNDA LINHA
        hints:
          - "for linha in texto.splitlines(): print(linha.upper())"
        solution: |
          texto = "primeira linha\nsegunda linha"
          for linha in texto.splitlines():
              print(linha.upper())
        must_include:
          - splitlines
        time_estimate: 120

  # ────────────────────────────────────────────────────────────────
  - id: auto_csv_json
    title: "CSV e JSON"
    color: "#0ea5e9"
    goals: ["automacao"]
    summary: "Os dois formatos universais: tabelas (CSV) e documentos (JSON) num pipeline."
    lessons:
      - id: auto_csv_json_intro
        title: "Do CSV ao JSON"
        blocks:
          - type: text
            body: |
              Planilhas exportam **CSV**; sistemas conversam em **JSON**. Uma automação clássica: ler CSV, somar, converter para JSON.

              Ler linha por linha com dicionário:
              ```python
              import csv
              import io

              texto = "fruta,qtd\nmaca,2\nbanana,3"
              for l in csv.DictReader(io.StringIO(texto)):
                  print(l["fruta"], l["qtd"])
              ```

              Converter o resumo para JSON:
              ```python
              import json
              print(json.dumps({"total": 5}))   # {"total": 5}
              ```
          - type: callout
            body: "Pipeline padrão: dados → CSV/DictReader → processamento → dict → json.dumps → API/planilha. Nunca edite a planilha na mão duas vezes."
    exercises:
      - id: auto_csv_json_1
        type: predict
        difficulty: easy
        xp: 20
        prompt: "O que será exibido?"
        code: |
          import csv
          import io

          texto = "fruta,qtd\nmaca,2\nbanana,3"
          for linha in csv.DictReader(io.StringIO(texto)):
              print(linha["fruta"], linha["qtd"])
        answer: |
          maca 2
          banana 3
        hints:
          - "DictReader trata a primeira linha como cabeçalho."
        time_estimate: 90

      - id: auto_csv_json_2
        type: complete
        difficulty: easy
        xp: 15
        prompt: |
          Complete com o leitor que transforma cada linha de CSV em um dicionário:
        code: |
          import csv
          import io

          for l in csv.____(io.StringIO(texto)):
              print(l["fruta"])
        answer: 'DictReader'
        hints:
        - "Dicionário = dict em inglês."
        time_estimate: 45

      - id: auto_csv_json_3
        type: predict
        difficulty: medium
        xp: 20
        prompt: "O que será exibido?"
        code: |
          import json

          print(json.dumps({"total": 5}))
        answer: |
          {"total": 5}
        hints:
          - "dumps converte dict para texto JSON."
        time_estimate: 60

      - id: auto_csv_json_4
        type: order
        difficulty: medium
        xp: 25
        prompt: Ordene o pipeline CSV → JSON.
        lines:
        - Ler o CSV com DictReader
        - Somar os valores das linhas
        - Montar o dicionário de resumo
        - Converter com json.dumps
        - Salvar/enviar o JSON
        hints:
        - "Primeiro os dados, o cálculo, e por fim o formato de saída."
        time_estimate: 120

      - id: auto_csv_json_5
        type: write
        difficulty: hard
        xp: 40
        prompt: |
          Escreva um programa que leia o CSV abaixo com `csv.DictReader`, some os valores da coluna `qtd` (com `int()`) e exiba o total.
        code: |
          texto = "fruta,qtd\nmaca,2\nbanana,3"
        tests:
          - name: "Total"
            expected: |
              5
        hints:
          - "total = 0; para cada linha: total += int(linha['qtd'])."
        solution: |
          import csv
          import io

          texto = "fruta,qtd\nmaca,2\nbanana,3"
          total = 0
          for linha in csv.DictReader(io.StringIO(texto)):
              total += int(linha["qtd"])
          print(total)
        must_include:
          - DictReader
        allow_imports:
          - csv
          - io
        time_estimate: 180

  # ────────────────────────────────────────────────────────────────
  - id: auto_excel
    title: "Planilhas Excel"
    color: "#22c55e"
    goals: ["automacao"]
    summary: "Ler, transformar e escrever .xlsx com openpyxl — sem abrir o Excel."
    lessons:
      - id: auto_excel_intro
        title: "Excel com código"
        blocks:
          - type: text
            body: |
              O módulo **openpyxl** lê e escreve arquivos `.xlsx` direto no código:

              ```python
              from openpyxl import load_workbook

              planilha = load_workbook("vendas.xlsx")     # abre o arquivo
              aba = planilha.active                        # aba ativa
              ```

              Você percorre as células, calcula e salva:
              ```python
              planilha.save("vendas_resumo.xlsx")
              ```
          - type: text
            body: |
              **Por que automatizar planilhas?** Relatórios de 200 linhas que saem toda sexta podem ser gerados em segundos — sem erro de copiar-e-colar e sem alguém 'mexer' na fórmula.
          - type: callout
            body: "No sandbox web o pacote e a escrita não estão disponíveis; o conceito (ler → transformar → salvar) é o mesmo de CSV, mas com formatação e fórmulas."
    exercises:
      - id: auto_excel_1
        type: choice
        difficulty: easy
        xp: 15
        prompt: Qual biblioteca Python lê e escreve arquivos Excel (.xlsx)?
        options:
        - openpyxl
        - numpy
        - datetime
        - re
        answer: '0'
        hints:
        - "open + py - xl (Excel)."
        time_estimate: 60

      - id: auto_excel_2
        type: complete
        difficulty: easy
        xp: 15
        prompt: |
          Complete com a extensão dos arquivos criados pelo Excel moderno:
        code: |
