level: 4
slug: "automacao"
title: "Trilha Automação"
subtitle: "Ensine a máquina fazer o seu trabalho repetitivo: arquivos, planilhas, relatórios e pipelines."

concepts:
  # ────────────────────────────────────────────────────────────────
  - id: auto_fundamentos
    title: "Fundamentos da automação"
    color: "#f59e0b"
    goals: ["automacao"]
    summary: "Entrada, processamento, saída e exceções: o ciclo de qualquer tarefa que roda sozinha."
    lessons:
      - id: auto_fundamentos_intro
        title: "O ciclo da tarefa automática"
        blocks:
          - type: text
            body: |
              Toda automação repete o mesmo ciclo **entrada → processamento → saída**, mas sem você na frente do computador:

              1. **Coletar** os dados (arquivos, planilhas, sites).
              2. **Processar** (limpar, calcular, transformar).
              3. **Validar** (confere se deu certo).
              4. **Entregar** (guardar, enviar, avisar).

              Uma função simples ilustra cada etapa:
              ```python
              def processar(nome, arquivo):
                  print(f"{nome}: processando {arquivo}")
              ```
          - type: text
            body: |
              **Exceções** são o que impede o robô de parar no meio da noite quando algo sai do esperado (arquivo faltando, dado errado). Tratar erro é parte da automação, não um detalhe.
          - type: callout
            body: "Comece pela tarefa que mais dói: repetitiva e sempre igual. Primeiro entenda, depois automatize."
    exercises:
      - id: auto_fundamentos_1
        type: choice
        difficulty: easy
        xp: 15
        prompt: Qual é a melhor candidata para automatizar primeiro?
        options:
        - Uma tarefa manual, repetitiva e sempre igual.
        - Uma tarefa criativa que muda toda hora.
        - Uma tarefa feita uma única vez no ano.
        - Uma tarefa que você já faz sem esforço.
        answer: '0'
        hints:
        - "Automático brilha no repetitivo."
        time_estimate: 60

      - id: auto_fundamentos_2
        type: predict
        difficulty: easy
        xp: 20
        prompt: "O que será exibido?"
        code: |
          def processar(nome, arquivo):
              print(f"{nome}: processando {arquivo}")

          processar("backup", "clientes.csv")
        answer: |
          backup: processando clientes.csv
        hints:
          - "f-string coloca os valores dentro do texto."
        time_estimate: 60

      - id: auto_fundamentos_3
        type: order
        difficulty: medium
        xp: 25
        prompt: Ordene o ciclo de uma tarefa automática.
        lines:
        - Coletar os dados
        - Processar
        - Validar o resultado
        - Entregar/avisar
        hints:
        - "Primeiro entra, depois transforma, confere e entrega."
        time_estimate: 90

      - id: auto_fundamentos_4
        type: choice
        difficulty: medium
        xp: 20
        prompt: Por que uma automação deve tratar ERROS (exceções)?
        options:
        - Para o robô não parar no meio da tarefa quando algo der errado.
        - Para ficar mais bonita.
        - Para rodar mais rápido.
        - Para não precisar de dados.
        answer: '0'
        hints:
        - "Um erro não tratado derruba o processo inteiro."
        time_estimate: 90

      - id: auto_fundamentos_5
        type: complete
        difficulty: easy
        xp: 15
        prompt: |
          Complete: o processo automático precisa tratar ____ para não parar sozinho na madrugada.
        answer: 'erros'
        hints:
        - "Para cada imprevisto deve existir um plano B."
        time_estimate: 45

      - id: auto_fundamentos_6
        type: write
        difficulty: medium
        xp: 30
        prompt: |
          Escreva um programa que mostre as três fases do pipeline: "1. coletar dados", "2. processar" e "3. gerar relatorio", cada uma em uma linha.
        tests:
          - name: "Pipeline"
            expected: |
              1. coletar dados
              2. processar
              3. gerar relatorio
        hints:
          - "Um print por fase."
        solution: |
