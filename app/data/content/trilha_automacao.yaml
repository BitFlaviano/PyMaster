  # ────────────────────────────────────────────────────────────────
  - id: auto_erros
    title: "Tratamento de erros e logs"
    color: "#dc2626"
    goals: ["automacao"]
    summary: "try/except para não parar e registros (logs) para saber o que aconteceu."
    lessons:
      - id: auto_erros_intro
        title: "Automação que sobrevive a imprevistos"
        blocks:
          - type: text
            body: |
              Tarefas automáticas pegam imprevistos o tempo todo: arquivo sumiu, dado veio errado, número inválido. Um **try/except** isola o erro:

              ```python
              try:
                  quantidade = int("abc")
              except ValueError:
                  print("entrada nao numerica")
              ```

              O `finally` roda de qualquer jeito (até com erro) — ideal para fechar conexões:
              ```python
              try:
                  processar()
              finally:
                  fechar()
              ```
          - type: text
            body: |
              **Logs** são o diário da automação: `logging.info("ok")`, `logging.error("falhou")`. Às 2h da manhã, é o log que diz o que devia estar certo e quebrou.
          - type: callout
            body: "try/except + logs = a diferença entre 'a automação quebrou à noite' e 'a automação registrou o erro à noite'."
    exercises:
      - id: auto_erros_1
        type: predict
        difficulty: easy
        xp: 20
        prompt: "O que será exibido?"
        code: |
          try:
              quantidade = int("abc")
          except ValueError:
              print("entrada nao numerica")
        answer: |
          entrada nao numerica
        hints:
          - "int(\"abc\") falha e cai no except."
        time_estimate: 90

