  # ────────────────────────────────────────────────────────────────
  - id: auto_projeto
    title: "Projeto final: pipeline de automação"
    color: "#facc15"
    goals: ["automacao"]
    summary: "Um pipeline completo: coletar CSV, processar, validar e gerar saída JSON."
    lessons:
      - id: auto_projeto_intro
        title: "Juntando tudo"
        blocks:
          - type: text
            body: |
              O projeto final une tudo que você viu: ler um CSV, somar, montar um resumo e transformar em JSON.

              Etapas:
              1. Ler as linhas com `csv.DictReader`.
              2. Calcular o total com `int()` em cada valor.
              3. Montar o dicionário de resumo.
              4. Converter com `json.dumps`.

              Em código, o esqueleto é curto — é essa a mágica:
              ```python
              import csv
              import io
              import json

              texto = "fruta,qtd\nmaca,2\nbanana,3"
              total = 0
              for l in csv.DictReader(io.StringIO(texto)):
                  total += int(l["qtd"])
              print("total de itens: " + str(total))
              print(json.dumps({"total": total}))
              ```
          - type: callout
