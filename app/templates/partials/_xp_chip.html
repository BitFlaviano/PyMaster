<div class="xp-chip">
  <div class="xp-chip-level">
    <span class="xp-lv">{{ xp_title }}</span>
    <span class="xp-lvnum">Nível {{ xp_level }}</span>
  </div>
  <div class="xp-bar"><div class="xp-fill" style="width: {{ xp_progress * 100 }}%"></div></div>
  <span class="xp-value">{{ user.xp }} XP</span>
</div>
